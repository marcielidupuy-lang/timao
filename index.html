<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timão · Painel de Implantação</title>
<meta name="description" content="Painel da implantação com duas visões: a do implantador e a da prefeitura.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=19">
<link rel="stylesheet" href="screens.css?v=19">
</head>
<body>

<div class="app">
  <nav class="rail" aria-label="Módulos">
    <a class="rail-logo" href="#/" aria-label="Aprova"><svg viewBox="0 0 40 40" class="logo-a"><path d="M10 33L20 8l10 25" stroke="#111" stroke-width="3.4" fill="none"/><path d="M2 22h36" stroke="#14c3d6" stroke-width="3.2"/></svg></a>
    <div class="rail-icons" id="railIcons"></div>
    <div class="rail-foot">
      <span class="rail-btn" id="railBell"></span>
      <span class="avatar" id="avatar">MD</span>
    </div>
  </nav>

  <aside class="nav2" aria-label="Navegação">
    <div class="nav2-who" id="who"></div>
    <div class="nav2-top" id="nav"></div>
    <div id="nav2Extra"></div>
  </aside>

  <main class="content">
    <div class="topbar">
      <a class="m-logo" href="#/" aria-label="Aprova"><svg viewBox="0 0 40 40" class="logo-a"><path d="M10 33L20 8l10 25" stroke="#111" stroke-width="3.4" fill="none"/><path d="M2 22h36" stroke="#14c3d6" stroke-width="3.2"/></svg></a>
      <div class="crumb" id="crumb"></div>
      <div class="role" role="tablist" aria-label="Visão">
        <button role="tab" data-role="i">Implantador</button>
        <button role="tab" data-role="c">Prefeitura</button>
      </div>
      <span class="conn" id="sync" title="Tudo que muda aqui é gravado no Pylon"><span class="dot"></span><span id="syncTxt">Pylon conectado</span></span>
    </div>

    <nav class="tabs-m" id="navM" aria-label="Seções"></nav>

    <div id="view"></div>

    <footer class="foot">
      <span>Timão · Hackathon Aprova 2026 · dados fictícios</span>
      <button class="link" id="reset">Reiniciar demo</button>
    </footer>
  </main>
</div>

<div class="player" id="player" hidden>
  <button class="close" id="closePlayer" aria-label="Fechar"></button>
  <div class="reel" id="reel"></div>
</div>

<aside class="drawer" id="drawer" hidden aria-label="Execução do agente"></aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js?v=19"></script>
<script src="app.js?v=19"></script>
</body>
</html>
